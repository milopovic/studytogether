<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StudyTogether ♡</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;1,500&display=swap');

:root {
  --pink: #e8a9bd;
  --dark-pink: #b96782;
  --light-pink: #fff1f5;
  --cream: #fffaf8;
  --text: #59444c;
  --soft: #f8dce5;
  --white: rgba(255,255,255,.84);
  --shadow: 0 12px 35px rgba(160,90,115,.12);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--text);
  font-family: "DM Sans", sans-serif;

  background:
    radial-gradient(circle at 10% 10%, #ffe1eb 0, transparent 25%),
    radial-gradient(circle at 90% 20%, #f9d5e2 0, transparent 25%),
    linear-gradient(135deg, #fff9fa, #fff0f4);
}

button,
input {
  font: inherit;
}

button {
  border: 0;
  cursor: pointer;
}

.top {
  max-width: 1100px;
  margin: auto;
  padding: 35px 22px 15px;

  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-family: "Playfair Display", serif;
  font-size: 31px;
  font-style: italic;
}

.logo span {
  color: var(--dark-pink);
}

.room-name {
  font-size: 13px;
  opacity: .7;
  margin-top: 5px;
}

.create-btn {
  background: var(--dark-pink);
  color: white;
  border-radius: 999px;
  padding: 12px 20px;
  box-shadow: var(--shadow);
}

.page {
  max-width: 1100px;
  margin: auto;
  padding: 10px 22px 50px;
}

/* INVITE */

.invite-box {
  display: none;
  margin: 18px 0;
  padding: 20px;
  background: rgba(255,255,255,.9);
  border: 1px solid #f0d4de;
  border-radius: 20px;
  box-shadow: var(--shadow);
}

.invite-box.visible {
  display: block;
}

.invite-title {
  font-family: "Playfair Display", serif;
  font-style: italic;
  font-size: 21px;
}

.invite-code {
  font-size: 25px;
  letter-spacing: 4px;
  margin: 10px 0;
  color: var(--dark-pink);
}

.invite-link {
  width: 100%;
  padding: 10px;
  border: 1px solid #efd6de;
  border-radius: 12px;
  background: #fffafa;
  margin-bottom: 9px;
}

.copy-btn {
  background: var(--dark-pink);
  color: white;
  border-radius: 999px;
  padding: 10px 17px;
}

/* PEOPLE */

.people-count {
  font-size: 13px;
  opacity: .6;
  margin: 18px 0 10px;
}

.video-area {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
}

.video-card {
  position: relative;
  min-height: 280px;
  background: #ead4dc;
  border-radius: 25px;
  overflow: hidden;
  box-shadow: var(--shadow);
}

.video-card video {
  width: 100%;
  height: 280px;
  object-fit: cover;
  display: block;
  background: #ead4dc;
}

.video-placeholder {
  height: 280px;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  color: white;
  font-size: 18px;

  background:
    linear-gradient(145deg, #e7bdca, #d9a8b9);
}

.video-placeholder span {
  font-size: 45px;
  margin-bottom: 5px;
}

.name {
  position: absolute;
  left: 16px;
  bottom: 14px;

  background: rgba(255,255,255,.82);
  padding: 8px 13px;
  border-radius: 999px;

  font-size: 13px;
  z-index: 5;
}

.video-controls {
  position: absolute;
  right: 13px;
  bottom: 13px;

  display: flex;
  gap: 7px;

  z-index: 5;
}

.video-controls button {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: rgba(255,255,255,.88);
}

/* TIMER */

.timer-card,
.card {
  background: var(--white);
  border: 1px solid rgba(255,255,255,.8);
  border-radius: 25px;
  box-shadow: var(--shadow);
}

.timer-card {
  margin-top: 18px;
  padding: 28px;
  text-align: center;
}

.timer-label {
  color: var(--dark-pink);
  font-size: 13px;
  letter-spacing: 1px;
}

#timer {
  font-size: clamp(60px, 10vw, 95px);
  font-weight: 500;
  letter-spacing: -4px;
  margin: 12px 0 0;
}

.timer-mode {
  opacity: .65;
  margin-bottom: 17px;
}

.timer-buttons,
.presets {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
}

.timer-buttons button,
.presets button {
  padding: 9px 15px;
  border-radius: 999px;
  background: var(--soft);
  color: var(--text);
}

.timer-buttons button:first-child {
  background: var(--dark-pink);
  color: white;
}

/* BOTTOM */

.bottom-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  margin-top: 18px;
}

.card {
  padding: 22px;
}

.card-title {
  font-family: "Playfair Display", serif;
  font-style: italic;
  font-size: 21px;
  margin-bottom: 18px;
}

/* GOALS */

.goal-input {
  display: flex;
  gap: 8px;
  margin-bottom: 15px;
}

.goal-input input {
  flex: 1;
  min-width: 0;
  border: 1px solid #efd6de;
  border-radius: 999px;
  padding: 10px 14px;
  outline: none;
  background: white;
}

.goal-input button {
  background: var(--dark-pink);
  color: white;
  border-radius: 999px;
  padding: 9px 15px;
}

.goals-list {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.goal-item {
  display: flex;
  align-items: center;
  gap: 9px;

  padding: 10px 11px;
  background: #fff1f5;
  border-radius: 14px;
}

.goal-checkbox {
  width: 22px;
  height: 22px;
  border-radius: 50%;

  border: 2px solid var(--pink);
  background: white;

  flex-shrink: 0;
}

.goal-checkbox.completed {
  background: var(--dark-pink);
  color: white;
}

.goal-content {
  flex: 1;
  min-width: 0;
}

.goal-text {
  line-height: 1.4;
  word-break: break-word;
}

.goal-text.completed {
  text-decoration: line-through;
  opacity: .5;
}

.goal-completed-by {
  font-size: 11px;
  opacity: .55;
  margin-top: 3px;
}

.goal-actions {
  display: flex;
  gap: 4px;
}

.goal-actions button {
  background: transparent;
  padding: 5px;
  opacity: .65;
}

.no-goals {
  text-align: center;
  opacity: .5;
  font-size: 13px;
  padding: 15px;
}

/* CHAT */

.messages {
  min-height: 130px;
  max-height: 220px;
  overflow-y: auto;
  padding-right: 5px;
}

.messages p {
  background: #fff1f5;
  padding: 8px 11px;
  border-radius: 13px;
  margin: 7px 0;
  font-size: 13px;
}

.chat-input {
  display: flex;
  gap: 7px;
  margin-top: 15px;
}

.chat-input input {
  flex: 1;
  border: 1px solid #efd6de;
  border-radius: 999px;
  padding: 10px 14px;
  outline: none;
  background: white;
}

.chat-input button {
  width: 40px;
  border-radius: 50%;
  background: var(--dark-pink);
  color: white;
}

.status {
  text-align: center;
  font-size: 12px;
  opacity: .55;
  margin: 14px;
}

footer {
  text-align: center;
  margin-top: 30px;
  font-family: "Playfair Display", serif;
  font-style: italic;
  opacity: .6;
}

@media(max-width: 700px) {

  .video-area,
  .bottom-grid {
    grid-template-columns: 1fr;
  }

  .top {
    align-items: flex-start;
    gap: 15px;
  }

  .create-btn {
    padding: 9px 13px;
  }
}
</style>
</head>

<body>

<header class="top">

  <div>
    <div class="logo">
      study<span>together</span> ♡
    </div>

    <div class="room-name">
      no room yet ✦
    </div>
  </div>

  <button class="create-btn" onclick="createRoom()">
    create room ♡
  </button>

</header>

<main class="page">

  <div class="invite-box" id="inviteBox">

    <div class="invite-title">
      your room is ready ♡
    </div>

    <div class="invite-code" id="inviteCode"></div>

    <input
      class="invite-link"
      id="inviteLink"
      readonly
      aria-label="Invite link"
    >

    <button class="copy-btn" onclick="copyInvite()">
      copy invite link ♡
    </button>

  </div>

  <div class="people-count" id="peopleCount">
    0 people in the room
  </div>

  <section class="video-area" id="videoArea">

    <!-- Video tiles are created here dynamically -->

  </section>

  <div class="status" id="status">
    ✦ create or join a room to begin ✦
  </div>

  <section class="timer-card">

    <div class="timer-label">
      ✦ focus session ✦
    </div>

    <div id="timer">
      25:00
    </div>

    <div class="timer-mode" id="timerMode">
      focus ♡
    </div>

    <div class="timer-buttons">

      <button onclick="startTimer()">
        start
      </button>

      <button onclick="pauseTimer()">
        pause
      </button>

      <button onclick="resetTimer()">
        reset
      </button>

    </div>

    <br>

    <div class="presets">

      <button onclick="setTimer(25)">
        25 min
      </button>

      <button onclick="setTimer(50)">
        50 min
      </button>

      <button onclick="setTimer(90)">
        90 min
      </button>

      <button onclick="customizeTimer()">
        ♡ customize
      </button>

    </div>

  </section>

  <section class="bottom-grid">

    <!-- GOALS -->

    <div class="card goal-card">

      <div class="card-title">
        🎀 shared goals
      </div>

      <div class="goal-input">

        <input
          id="goalInput"
          placeholder="add a goal..."
          aria-label="New goal"
          onkeydown="if(event.key==='Enter') addGoal()"
        >

        <button onclick="addGoal()">
          + add
        </button>

      </div>

      <div
        class="goals-list"
        id="goalsList"
      ></div>

      <div class="small-text">
        everyone in the room can see your progress ✦
      </div>

    </div>

    <!-- CHAT -->

    <div class="card chat-card">

      <div class="card-title">
        💌 chat
      </div>

      <div
        class="messages"
        id="messages"
      ></div>

      <div class="chat-input">

        <input
          id="chatInput"
          placeholder="say something..."
          aria-label="Chat message"
          onkeydown="if(event.key==='Enter') sendMessage()"
        >

        <button onclick="sendMessage()">
          ♡
        </button>

      </div>

    </div>

  </section>

  <footer>
    study together, but separately ♡
  </footer>

</main>


<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
  "https://iiiozzkiguawjnfjwufm.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_M9cPuA11Q8-Fh0UAczdT-Q_OgAcMQBz";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   GLOBAL STATE
   ========================================================= */

let roomCode = null;
let roomId = null;
let myName = null;

let participantId =
  crypto.randomUUID();

let channel = null;
let localStream = null;

const peers = new Map();

let micOn = true;
let cameraOn = true;


/* =========================================================
   TIMER
   ========================================================= */

let timerInterval = null;

let timerSeconds = 25 * 60;

let focusMinutes = 25;
let breakMinutes = 5;

let timerRunning = false;
let timerMode = "focus";

let timerStartedAt = null;


/* =========================================================
   GOALS
   ========================================================= */

let goals = [];

let goalsChannel = null;


/* =========================================================
   HELPERS
   ========================================================= */

function showStatus(text) {

  document.getElementById("status")
    .textContent = text;

}


function formatTime(seconds) {

  seconds = Math.max(0, Math.floor(seconds));

  const minutes =
    Math.floor(seconds / 60)
      .toString()
      .padStart(2, "0");

  const secs =
    (seconds % 60)
      .toString()
      .padStart(2, "0");

  return `${minutes}:${secs}`;
}


function updateTimerDisplay() {

  document.getElementById("timer")
    .textContent =
    formatTime(timerSeconds);

}


function updateTimerModeDisplay() {

  document.getElementById("timerMode")
    .textContent =
    timerMode === "focus"
      ? "focus ♡"
      : "break ✦";

}


/* =========================================================
   VIDEO TILE
   ========================================================= */

function createVideoTile(
  id,
  name,
  stream,
  isLocal = false
) {

  let existing =
    document.getElementById(
      "video-" + id
    );

  if (existing) {

    const video =
      existing.querySelector("video");

    if (stream && video) {
      video.srcObject = stream;
    }

    return existing;
  }

  const card =
    document.createElement("div");

  card.className =
    "video-card";

  card.id =
    "video-" + id;


  const video =
    document.createElement("video");

  video.autoplay = true;
  video.playsInline = true;

  if (isLocal) {
    video.muted = true;
  }

  if (stream) {
    video.srcObject = stream;
  }


  const nameLabel =
    document.createElement("div");

  nameLabel.className =
    "name";

  nameLabel.textContent =
    name + (isLocal ? " ♡" : "");


  const controls =
    document.createElement("div");

  controls.className =
    "video-controls";


  if (isLocal) {

    const mic =
      document.createElement("button");

    mic.id = "micBtn";
    mic.textContent = "🎙️";

    mic.onclick =
      toggleMic;


    const camera =
      document.createElement("button");

    camera.id = "cameraBtn";
    camera.textContent = "📷";

    camera.onclick =
      toggleCamera;


    controls.appendChild(mic);
    controls.appendChild(camera);

  }


  card.appendChild(video);
  card.appendChild(nameLabel);
  card.appendChild(controls);

  document.getElementById("videoArea")
    .appendChild(card);


  return card;
}


function removeVideoTile(id) {

  const tile =
    document.getElementById(
      "video-" + id
    );

  if (tile) {
    tile.remove();
  }
}


function updatePeopleCount() {

  const count =
    1 + peers.size;

  document.getElementById(
    "peopleCount"
  ).textContent =
    count === 1
      ? "1 person in the room"
      : `${count} people in the room`;
}


/* =========================================================
   CAMERA
   ========================================================= */

async function startCamera() {

  if (localStream)
    return localStream;

  try {

    localStream =
      await navigator.mediaDevices
        .getUserMedia({
          video: true,
          audio: true
        });

    createVideoTile(
      participantId,
      myName || "you",
      localStream,
      true
    );

    return localStream;

  } catch (error) {

    console.error(
      "Camera error:",
      error
    );

    showStatus(
      "camera permission was not available ♡"
    );

    return null;
  }
}


function toggleMic() {

  if (!localStream)
    return;

  const track =
    localStream
      .getAudioTracks()[0];

  if (!track)
    return;

  micOn = !micOn;

  track.enabled =
    micOn;

  const button =
    document.getElementById(
      "micBtn"
    );

  if (button) {

    button.textContent =
      micOn
        ? "🎙️"
        : "🔇";
  }
}


function toggleCamera() {

  if (!localStream)
    return;

  const track =
    localStream
      .getVideoTracks()[0];

  if (!track)
    return;

  cameraOn = !cameraOn;

  track.enabled =
    cameraOn;

  const button =
    document.getElementById(
      "cameraBtn"
    );

  if (button) {

    button.textContent =
      cameraOn
        ? "📷"
        : "🚫";
  }
}


/* =========================================================
   CREATE ROOM
   ========================================================= */

async function createRoom() {

  const name =
    prompt(
      "What's your name? ♡"
    );

  if (!name || !name.trim())
    return;

  myName =
    name.trim();


  const generatedCode =
    Math.random()
      .toString(36)
      .substring(2, 8)
      .toUpperCase();


  const { data: room, error } =
    await supabaseClient
      .from("rooms")
      .insert([{
        room_code: generatedCode,
        focus_minutes: 25,
        break_minutes: 5,
        timer_mode: "focus",
        time_left: 25 * 60
      }])
      .select()
      .single();


  if (error) {

    console.error(error);

    alert(
      "Something went wrong creating the room ♡"
    );

    return;
  }


  const { error: participantError } =
    await supabaseClient
      .from("participants")
      .insert([{
        room_id: room.id,
        name: myName
      }]);


  if (participantError) {

    console.error(
      participantError
    );

    alert(
      "The room was created, but we couldn't register you ♡"
    );

    return;
  }


  roomCode =
    generatedCode;

  roomId =
    room.id;


  sessionStorage.setItem(
    "studyTogetherName",
    myName
  );

  sessionStorage.setItem(
    "studyTogetherRoom",
    roomCode
  );


  const roomUrl =
    window.location.origin +
    window.location.pathname +
    "?room=" +
    roomCode;


  document.querySelector(
    ".room-name"
  ).textContent =
    `room ${roomCode} ✦`;


  document.getElementById(
    "inviteCode"
  ).textContent =
    roomCode;


  document.getElementById(
    "inviteLink"
  ).value =
    roomUrl;


  document.getElementById(
    "inviteBox"
  ).classList.add(
    "visible"
  );


  history.replaceState(
    {},
    "",
    "?room=" + roomCode
  );


  await enterRoom();
}


/* =========================================================
   JOIN ROOM
   ========================================================= */

async function joinRoomFromLink() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const code =
    params.get("room");


  if (!code) {

    await startCamera();

    return;
  }


  const upperCode =
    code.toUpperCase();


  const { data: room, error } =
    await supabaseClient
      .from("rooms")
      .select("*")
      .eq(
        "room_code",
        upperCode
      )
      .single();


  if (error || !room) {

    alert(
      "We couldn't find that study room ♡"
    );

    return;
  }


  roomCode =
    upperCode;

  roomId =
    room.id;


  const savedName =
    sessionStorage.getItem(
      "studyTogetherName"
    );

  const savedRoom =
    sessionStorage.getItem(
      "studyTogetherRoom"
    );


  if (
    savedName &&
    savedRoom === upperCode
  ) {

    myName =
      savedName;

  } else {

    const name =
      prompt(
        "You've been invited to study together ♡\n\nWhat's your name?"
      );

    if (!name || !name.trim())
      return;

    myName =
      name.trim();


    sessionStorage.setItem(
      "studyTogetherName",
      myName
    );

    sessionStorage.setItem(
      "studyTogetherRoom",
      upperCode
    );


    const { error: joinError } =
      await supabaseClient
        .from("participants")
        .insert([{
          room_id: room.id,
          name: myName
        }]);


    if (joinError) {

      console.error(
        joinError
      );

      alert(
        "We couldn't add you to the room ♡"
      );

      return;
    }
  }


  document.querySelector(
    ".room-name"
  ).textContent =
    `room ${upperCode} ✦`;


  document.getElementById(
    "inviteBox"
  ).classList.remove(
    "visible"
  );


  await enterRoom();
}


/* =========================================================
   ENTER ROOM
   ========================================================= */

async function enterRoom() {

  await startCamera();


  createVideoTile(
    participantId,
    myName,
    localStream,
    true
  );


  channel =
    supabaseClient.channel(
      "study-room-" + roomCode,
      {
        config: {
          presence: {
            key: participantId
          }
        }
      }
    );


  /* PRESENCE */

  channel.on(
    "presence",
    {
      event: "sync"
    },
    async () => {

      const state =
        channel.presenceState();


      const people = [];


      Object.entries(state)
        .forEach(
          ([key, entries]) => {

            if (
              key === participantId
            )
              return;

            const person =
              entries[0];

            if (!person)
              return;

            people.push({
              id: key,
              name:
                person.name ||
                "study buddy"
            });
          }
        );


      /*
       * Remove people who are no longer present.
       */

      for (
        const [id, peer] of peers
      ) {

        const stillHere =
          people.some(
            person =>
              person.id === id
          );

        if (!stillHere) {

          if (
            peer.connection
          ) {
            peer.connection.close();
          }

          peers.delete(id);

          removeVideoTile(id);
        }
      }


      /*
       * Create connections for everyone.
       */

      for (const person of people) {

        await ensurePeer(
          person.id,
          person.name
        );
      }


      updatePeopleCount();


      if (people.length === 0) {

        showStatus(
          "waiting for your study buddies... ♡"
        );

      } else {

        showStatus(
          `${people.length + 1} people studying together ♡`
        );
      }
    }
  );


  /* SIGNALING */

  channel.on(
    "broadcast",
    {
      event: "offer"
    },
    async ({ payload }) => {

      if (
        payload.to !== participantId
      )
        return;

      await handleOffer(
        payload.from,
        payload.name,
        payload.offer
      );
    }
  );


  channel.on(
    "broadcast",
    {
      event: "answer"
    },
    async ({ payload }) => {

      if (
        payload.to !== participantId
      )
        return;

      const peer =
        peers.get(
          payload.from
        );

      if (!peer)
        return;

      try {

        await peer.connection
          .setRemoteDescription(
            new RTCSessionDescription(
              payload.answer
            )
          );

      } catch (error) {

        console.error(
          "Answer error:",
          error
        );
      }
    }
  );


  channel.on(
    "broadcast",
    {
      event: "ice"
    },
    async ({ payload }) => {

      if (
        payload.to !== participantId
      )
        return;

      const peer =
        peers.get(
          payload.from
        );

      if (!peer)
        return;

      try {

        await peer.connection
          .addIceCandidate(
            new RTCIceCandidate(
              payload.candidate
            )
          );

      } catch (error) {

        console.error(
          "ICE candidate error:",
          error
        );
      }
    }
  );


  /* CHAT */

  channel.on(
    "broadcast",
    {
      event: "chat"
    },
    ({ payload }) => {

      addMessage(
        payload.name,
        payload.message
      );
    }
  );


  /* TIMER */

  channel.on(
    "broadcast",
    {
      event: "timer"
    },
    ({ payload }) => {

      applyRemoteTimer(
        payload
      );
    }
  );


  await channel.subscribe(
    async status => {

      if (
        status !== "SUBSCRIBED"
      )
        return;


      await channel.track({
        name: myName
      });


      showStatus(
        "you're in the room ♡"
      );


      await loadGoals();

      subscribeToGoals();
    }
  );
}


/* =========================================================
   WEBRTC MULTI-PERSON
   ========================================================= */

async function ensurePeer(
  id,
  name
) {

  if (id === participantId)
    return;


  if (peers.has(id)) {

    const existing =
      peers.get(id);

    existing.name =
      name;

    return;
  }


  const connection =
    new RTCPeerConnection({
      iceServers: [
        {
          urls:
            "stun:stun.l.google.com:19302"
        },
        {
          urls:
            "stun:stun1.l.google.com:19302"
        }
      ]
    });


  if (localStream) {

    localStream
      .getTracks()
      .forEach(
        track => {

          connection.addTrack(
            track,
            localStream
          );

        }
      );
  }


  const peer = {
    connection,
    name,
    makingOffer: false,
    candidateQueue: []
  };


  peers.set(
    id,
    peer
  );


  connection.ontrack =
    event => {

      const stream =
        event.streams[0];

      createVideoTile(
        id,
        name,
        stream,
        false
      );

      showStatus(
        `${name} joined the study room ♡`
      );
    };


  connection.onicecandidate =
    async event => {

      if (
        !event.candidate ||
        !channel
      )
        return;


      await channel.send({
        type: "broadcast",
        event: "ice",
        payload: {
          from:
            participantId,
          to: id,
          candidate:
            event.candidate
        }
      });
    };


  /*
   * Deterministic rule:
   * the participant with the smaller ID
   * creates the offer.
   *
   * This prevents both sides from creating
   * competing offers.
   */

  if (
    participantId < id
  ) {

    try {

      peer.makingOffer =
        true;

      const offer =
        await connection
          .createOffer();

      await connection
        .setLocalDescription(
          offer
        );


      await channel.send({
        type: "broadcast",
        event: "offer",
        payload: {
          from:
            participantId,
          to:
            id,
          name:
            myName,
          offer
        }
      });

    } catch (error) {

      console.error(
        "Offer error:",
        error
      );

    } finally {

      peer.makingOffer =
        false;
    }
  }
}


async function handleOffer(
  from,
  name,
  offer
) {

  let peer =
    peers.get(from);


  if (!peer) {

    const connection =
      new RTCPeerConnection({
        iceServers: [
          {
            urls:
              "stun:stun.l.google.com:19302"
          },
          {
            urls:
              "stun:stun1.l.google.com:19302"
          }
        ]
      });


    if (localStream) {

      localStream
        .getTracks()
        .forEach(
          track => {

            connection.addTrack(
              track,
              localStream
            );

          }
        );
    }


    peer = {
      connection,
      name,
      makingOffer: false,
      candidateQueue: []
    };


    peers.set(
      from,
      peer
    );


    connection.ontrack =
      event => {

        createVideoTile(
          from,
          name,
          event.streams[0],
          false
        );

        updatePeopleCount();
      };


    connection.onicecandidate =
      async event => {

        if (
          !event.candidate
        )
          return;

        await channel.send({
          type: "broadcast",
          event: "ice",
          payload: {
            from:
              participantId,
            to:
              from,
            candidate:
              event.candidate
          }
        });
      };
  }


  try {

    await peer.connection
      .setRemoteDescription(
        new RTCSessionDescription(
          offer
        )
      );


    const answer =
      await peer.connection
        .createAnswer();


    await peer.connection
      .setLocalDescription(
        answer
      );


    await channel.send({
      type: "broadcast",
      event: "answer",
      payload: {
        from:
          participantId,
        to:
          from,
        answer
      }
    });


  } catch (error) {

    console.error(
      "Offer handling error:",
      error
    );
  }
}

   ========================================================= */

function addMessage(
  name,
  message
) {

  const container =
    document.getElementById(
      "messages"
    );


  const p =
    document.createElement(
      "p"
    );


  const bold =
    document.createElement(
      "b"
    );


  bold.textContent =
    name + ":";


  p.appendChild(
    bold
  );


  p.appendChild(
    document.createTextNode(
      " " + message
    )
  );


  container.appendChild(
    p
  );


  container.scrollTop =
    container.scrollHeight;
}


async function sendMessage() {

  const input =
    document.getElementById(
      "chatInput"
    );


  const message =
    input.value.trim();


  if (
    !message ||
    !channel
  )
    return;


  addMessage(
    myName,
    message
  );


  await channel.send({
    type: "broadcast",
    event: "chat",
    payload: {
      name:
        myName,
      message
    }
  });


  input.value =
    "";
}


/* =========================================================
   GOALS
   ========================================================= */

async function loadGoals() {

  if (!roomId)
    return;


  const {
    data,
    error
  } =
    await supabaseClient
      .from("goals")
      .select("*")
      .eq(
        "room_id",
        roomId
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(
      "Goal loading error:",
      error
    );

    return;
  }


  goals =
    data || [];


  renderGoals();
}


function renderGoals() {

  const list =
    document.getElementById(
      "goalsList"
    );


  list.innerHTML =
    "";


  if (!goals.length) {

    const empty =
      document.createElement(
        "div"
      );

    empty.className =
      "no-goals";

    empty.textContent =
      "No goals yet ♡ Add one above!";

    list.appendChild(
      empty
    );

    return;
  }


  goals.forEach(
    goal => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "goal-item";


      const checkbox =
        document.createElement(
          "button"
        );

      checkbox.className =
        "goal-checkbox" +
        (
          goal.completed
            ? " completed"
            : ""
        );

      checkbox.textContent =
        goal.completed
          ? "✓"
          : "";


      checkbox.onclick =
        () => toggleGoal(
          goal
        );


      const content =
        document.createElement(
          "div"
        );

      content.className =
        "goal-content";


      const text =
        document.createElement(
          "div"
        );

      text.className =
        "goal-text" +
        (
          goal.completed
            ? " completed"
            : ""
        );

      text.textContent =
        goal.text;


      content.appendChild(
        text
      );


      if (
        goal.completed &&
        goal.completed_by
      ) {

        const completedBy =
          document.createElement(
            "div"
          );

        completedBy.className =
          "goal-completed-by";

        completedBy.textContent =
          `✓ completed by ${goal.completed_by}`;

        content.appendChild(
          completedBy
        );
      }


      const actions =
        document.createElement(
          "div"
        );

      actions.className =
        "goal-actions";


      const edit =
        document.createElement(
          "button"
        );

      edit.textContent =
        "✎";

      edit.title =
        "Edit goal";

      edit.onclick =
        () => editGoal(
          goal
        );


      const remove =
        document.createElement(
          "button"
        );

      remove.textContent =
        "×";

      remove.title =
        "Delete goal";

      remove.onclick =
        () => deleteGoal(
          goal
        );


      actions.appendChild(
        edit
      );

      actions.appendChild(
        remove
      );


      item.appendChild(
        checkbox
      );

      item.appendChild(
        content
      );

      item.appendChild(
        actions
      );


      list.appendChild(
        item
      );
    }
  );
}


async function addGoal() {

  if (!roomId) {

    alert(
      "Create or join a room first ♡"
    );

    return;
  }


  const input =
    document.getElementById(
      "goalInput"
    );


  const text =
    input.value.trim();


  if (!text)
    return;


  const {
    data,
    error
  } =
    await supabaseClient
      .from("goals")
      .insert([{
        room_id:
          roomId,
        text:
          text,
        completed:
          false,
        completed_by:
          null
      }])
      .select()
      .single();


  if (error) {

    console.error(
      "Add goal error:",
      error
    );

    alert(
      "Couldn't add that goal ♡"
    );

    return;
  }


  input.value =
    "";


  /*
   * Realtime will update everyone.
   * We also update ourselves immediately.
   */

  const exists =
    goals.some(
      goal =>
        goal.id === data.id
    );


  if (!exists) {

    goals.push(
      data
    );

    renderGoals();
  }
}


async function toggleGoal(
  goal
) {

  const completed =
    !goal.completed;


  const {
    data,
    error
  } =
    await supabaseClient
      .from("goals")
      .update({
        completed,
        completed_by:
          completed
            ? myName
            : null
      })
      .eq(
        "id",
        goal.id
      )
      .select()
      .single();


  if (error) {

    console.error(
      "Goal update error:",
      error
    );

    return;
  }


  updateGoalLocally(
    data
  );
}


async function editGoal(
  goal
) {

  const text =
    prompt(
      "Edit your goal ♡",
      goal.text
    );


  if (
    text === null ||
    !text.trim()
  )
    return;


  const {
    data,
    error
  } =
    await supabaseClient
      .from("goals")
      .update({
        text:
          text.trim()
      })
      .eq(
        "id",
        goal.id
      )
      .select()
      .single();


  if (error) {

    console.error(
      "Goal edit error:",
      error
    );

    return;
  }


  updateGoalLocally(
    data
  );
}


async function deleteGoal(
  goal
) {

  const yes =
    confirm(
      `Delete "${goal.text}"?`
    );


  if (!yes)
    return;


  const {
    error
  } =
    await supabaseClient
      .from("goals")
      .delete()
      .eq(
        "id",
        goal.id
      );


  if (error) {

    console.error(
      "Goal delete error:",
      error
    );

    return;
  }


  goals =
    goals.filter(
      item =>
        item.id !== goal.id
    );


  renderGoals();
}


function updateGoalLocally(
  updated
) {

  const index =
    goals.findIndex(
      goal =>
        goal.id === updated.id
    );


  if (index === -1) {

    goals.push(
      updated
    );

  } else {

    goals[index] =
      updated;
  }


  renderGoals();
}


/* =========================================================
   GOALS REALTIME
   ========================================================= */

function subscribeToGoals() {

  if (
    goalsChannel ||
    !roomId
  )
    return;


  goalsChannel =
    supabaseClient
      .channel(
        "goals-" + roomId
      )
      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "goals",
          filter:
            "room_id=eq." +
            roomId
        },
        payload => {

          if (
            payload.eventType ===
            "INSERT"
          ) {

            const exists =
              goals.some(
                goal =>
                  goal.id ===
                  payload.new.id
              );

            if (!exists) {

              goals.push(
                payload.new
              );
            }
          }


          if (
            payload.eventType ===
            "UPDATE"
          ) {

            updateGoalLocally(
              payload.new
            );

            return;
          }


          if (
            payload.eventType ===
            "DELETE"
          ) {

            goals =
              goals.filter(
                goal =>
                  goal.id !==
                  payload.old.id
              );
          }


          renderGoals();
        }
      )
      .subscribe();
}


/* =========================================================
   TIMER
   ========================================================= */

function startLocalTimer() {

  if (timerInterval)
    return;


  timerRunning =
    true;

  timerStartedAt =
    Date.now();


  timerInterval =
    setInterval(
      () => {

        if (
          timerSeconds > 0
        ) {

          timerSeconds--;

          updateTimerDisplay();

        } else {

          switchTimerMode();
        }

      },
      1000
    );
}


function stopLocalTimer() {

  timerRunning =
    false;

  clearInterval(
    timerInterval
  );

  timerInterval =
    null;
}


function broadcastTimer() {

  if (!channel)
    return;


  channel.send({
    type:
      "broadcast",

    event:
      "timer",

    payload: {

      seconds:
        timerSeconds,

      mode:
        timerMode,

      running:
        timerRunning
    }
  });
}


function startTimer() {

  startLocalTimer();

  broadcastTimer();
}


function pauseTimer() {

  stopLocalTimer();

  broadcastTimer();
}


function resetTimer() {

  stopLocalTimer();


  timerSeconds =
    (
      timerMode === "focus"
        ? focusMinutes
        : breakMinutes
    ) * 60;


  updateTimerDisplay();

  broadcastTimer();
}


function switchTimerMode() {

  stopLocalTimer();


  if (
    timerMode === "focus"
  ) {

    timerMode =
      "break";

    timerSeconds =
      breakMinutes * 60;

  } else {

    timerMode =
      "focus";

    timerSeconds =
      focusMinutes * 60;
  }


  updateTimerModeDisplay();

  updateTimerDisplay();

  broadcastTimer();
}


function setTimer(minutes) {

  focusMinutes =
    Number(minutes);

  timerMode =
    "focus";

  stopLocalTimer();

  timerSeconds =
    focusMinutes * 60;


  updateTimerModeDisplay();

  updateTimerDisplay();

  broadcastTimer();
}


function customizeTimer() {

  const focus =
    prompt(
      "How many minutes should focus be? ♡",
      focusMinutes
    );


  if (
    focus === null
  )
    return;


  const breakTime =
    prompt(
      "How many minutes should the break be? ✦",
      breakMinutes
    );


  if (
    breakTime === null
  )
    return;


  const f =
    Number(focus);

  const b =
    Number(breakTime);


  if (
    !Number.isFinite(f) ||
    !Number.isFinite(b) ||
    f <= 0 ||
    b <= 0
  ) {

    alert(
      "Please enter positive numbers ♡"
    );

    return;
  }


  focusMinutes =
    f;

  breakMinutes =
    b;

  timerMode =
    "focus";

  stopLocalTimer();

  timerSeconds =
    focusMinutes * 60;


  updateTimerModeDisplay();

  updateTimerDisplay();

  broadcastTimer();
}


function applyRemoteTimer(
  payload
) {

  stopLocalTimer();


  timerSeconds =
    Number(
      payload.seconds
    );

  timerMode =
    payload.mode === "break"
      ? "break"
      : "focus";


  updateTimerModeDisplay();

  updateTimerDisplay();


  if (
    payload.running
  ) {

    startLocalTimer();
  }
}


/* =========================================================
   INITIALIZE
   ========================================================= */

updateTimerDisplay();

updateTimerModeDisplay();

joinRoomFromLink();

</script>
