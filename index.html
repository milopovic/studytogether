  <style>

    body {

      content: "";

      inset: 0;
      pointer-events: none;
      opacity: .12;

    }

    .page {
      width: min(1100px, 92%);
      margin: auto;
      padding: 35px 0 25px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .logo {
      font-family: "Playfair Display", serif;
      font-size: 28px;
      font-style: italic;
    }

    .room-name {
      font-size: 13px;
      opacity: .7;
    }
.room-controls {
  display: flex;
  align-items: center;
  gap: 12px;
}

.room-controls button {
  font-size: 11px;
  padding: 8px 14px;
}
    main {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .video-area {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .video-card {
      background: rgba(255,255,255,.35);
      border: 1px solid rgba(255,255,255,.65);
      border-radius: 24px;
      padding: 12px;
      box-shadow: 0 10px 30px rgba(105,60,72,.08);
    }

    .video-placeholder {
      height: 270px;
      border-radius: 18px;
      background:
        linear-gradient(135deg, #d7aeb9, #c996a5);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      box-shadow: inset 0 0 50px rgba(80,30,45,.08);
    }

    .video-placeholder span {
      font-size: 38px;
    }

    .video-placeholder p {
      margin: 8px 0 0;
      font-size: 13px;
      opacity: .9;
    }

    .name {
      padding: 10px 4px 3px;
      font-size: 13px;
    }

    .timer-card {
      text-align: center;
      padding: 35px;
      background: rgba(255,248,250,.62);
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 28px;
      box-shadow: 0 15px 40px rgba(105,60,72,.09);
    }

    .timer-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 3px;
      opacity: .55;
    }

    #timer {
      font-family: "Playfair Display", serif;
      font-size: clamp(70px, 12vw, 120px);
      line-height: 1;
      margin: 15px 0 5px;
      color: #583b43;
    }

    .timer-mode {
      font-size: 13px;
      font-style: italic;
      opacity: .6;
      margin-bottom: 22px;
    }

    button {
      border: none;
      cursor: pointer;
      font-family: inherit;
      color: #573b43;
      background: #f3dce2;
      padding: 10px 18px;
      border-radius: 50px;
      transition: .2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      background: #e7c3cd;
    }

    .timer-buttons {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .timer-buttons button:first-child {
      background: #9d6676;
      color: white;
      padding-left: 25px;
      padding-right: 25px;
    }

    .presets {
      margin-top: 15px;
      display: flex;
      justify-content: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .presets button {
      font-size: 11px;
      padding: 7px 12px;
      background: transparent;
      border: 1px solid rgba(120,75,90,.15);
    }

    .bottom-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .card {
      background: rgba(255,248,250,.55);
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(105,60,72,.07);
    }

    .card-title {
      font-family: "Playfair Display", serif;
      font-style: italic;
      font-size: 19px;
      margin-bottom: 18px;
    }

    .goal {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .goal-text {
      font-size: 14px;
      line-height: 1.5;
    }

    .goal button {
      font-size: 11px;
      white-space: nowrap;
    }

    .goal-line {
      height: 1px;
      background: rgba(100,60,70,.12);
      margin: 18px 0 12px;
    }

    .small-text {
      font-size: 11px;
      opacity: .55;
    }

    .messages {
      min-height: 120px;
      font-size: 12px;
      line-height: 1.7;
    }

    .messages p {

    }

    .chat-input {
      display: flex;
      gap: 7px;
    }

    .chat-input input {
      flex: 1;
      border: none;
      outline: none;
      background: rgba(255,255,255,.65);
      border-radius: 50px;
      padding: 11px 15px;
      font-family: inherit;
      color: #4b343b;
    }

    .chat-input button {

    }

    footer {
      text-align: center;
      font-family: "Playfair Display", serif;
      font-style: italic;
      font-size: 12px;
      opacity: .5;
      padding: 28px 0 5px;

    @media (max-width: 700px) {

      .bottom-grid {
        grid-template-columns: 1fr;
      }

      .video-placeholder {

      }

        align-items: flex-start;
        gap: 10px;
        flex-direction: column;

  </style>

<body>

<div class="page">

<header>
  <div class="logo">studytogether ♡</div>

  <div class="room-controls">
    <div class="room-name">psychology study room ✦</div>
    <button onclick="createRoom()">create room ♡</button>
  </div>
</header>

  <main>

    <section class="video-area">

      <div class="video-card">
        <div class="video-placeholder">
          <span>♡</span>
          <p>you</p>
        </div>
        <div class="name">you ♡</div>
      </div>

      <div class="video-card">
        <div class="video-placeholder">
          <span>✦</span>
          <p>waiting...</p>
        </div>
        <div class="name">your study buddy</div>
      </div>

    </section>

    <section class="timer-card">

      <div class="timer-label">✦ focus session ✦</div>

      <div id="timer">25:00</div>

      <div class="timer-mode">focus ♡</div>

      <div class="timer-buttons">
        <button onclick="startTimer()">start</button>
        <button onclick="pauseTimer()">pause</button>
        <button onclick="resetTimer()">reset</button>
      </div>

      <div class="presets">
        <button onclick="setTimer(25)">25 min</button>
        <button onclick="setTimer(50)">50 min</button>
        <button onclick="setTimer(90)">90 min</button>
        <button onclick="customizeTimer()">♡ customize</button>
      </div>

    </section>

    <section class="bottom-grid">

      <div class="card goal-card">

        <div class="card-title">🎀 my goal</div>

        <div class="goal">

          <div class="goal-text">
            Finish 30 pages of cognitive psychology
          </div>

          <button>edit ♡</button>

        </div>

        <div class="goal-line"></div>

        <div class="small-text">
          one little step at a time ✦
        </div>

      </div>

      <div class="card chat-card">

        <div class="card-title">💌 chat</div>

        <div class="messages">
          <p><b>lena:</b> starting now ♡</p>
          <p><b>you:</b> good luck!!</p>
          <p><b>lena:</b> we got this ✦</p>
        </div>

        <div class="chat-input">

          <input placeholder="say something..." />

          <button>♡</button>

        </div>

      </div>

    </section>

  </main>

  <footer>
    study together, but separately ♡
  </footer>

</div>

<script>

let focusMinutes = 25;
let breakMinutes = 5;

let timeLeft = focusMinutes * 60;
let timerInterval = null;
let currentMode = "focus";

function updateDisplay() {

  const minutes = Math.floor(timeLeft / 60);
  const seconds = timeLeft % 60;

  document.getElementById("timer").textContent =
    `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;

  document.querySelector(".timer-mode").textContent =
    currentMode === "focus"
      ? "focus ♡"
      : "little break ✦";
}

function startTimer() {

  if (timerInterval) return;

  timerInterval = setInterval(() => {

    if (timeLeft > 0) {

      timeLeft--;
      updateDisplay();

      return;
    }

    if (currentMode === "focus") {

      currentMode = "break";
      timeLeft = breakMinutes * 60;

    } else {

      currentMode = "focus";
      timeLeft = focusMinutes * 60;

    }

    updateDisplay();

  }, 1000);
}

function pauseTimer() {

  clearInterval(timerInterval);
  timerInterval = null;

}

function resetTimer() {

  pauseTimer();

  currentMode = "focus";
  timeLeft = focusMinutes * 60;

  updateDisplay();

}

function setTimer(minutes) {

  pauseTimer();

  focusMinutes = minutes;
  currentMode = "focus";
  timeLeft = focusMinutes * 60;

  updateDisplay();

}

function customizeTimer() {

  const newFocus = prompt(
    "How many minutes should the focus session be?"
  );

  if (newFocus === null || newFocus === "") return;

  const newBreak = prompt(
    "How many minutes should the break be?"
  );

  if (newBreak === null || newBreak === "") return;

  const focus = Number(newFocus);
  const breakTime = Number(newBreak);

  if (
    !Number.isFinite(focus) ||
    !Number.isFinite(breakTime) ||
    focus <= 0 ||
    breakTime < 0
  ) {

    alert("Please enter valid numbers ♡");
    return;

  }

  focusMinutes = focus;
  breakMinutes = breakTime;

  currentMode = "focus";
  timeLeft = focusMinutes * 60;

  updateDisplay();

}

updateDisplay();
async function createRoom() {

  const roomCode = Math.random()
    .toString(36)
    .substring(2, 8)
    .toUpperCase();

  const { data, error } = await supabaseClient
    .from("rooms")
    .insert([
      {
        room_code: roomCode,
        focus_minutes: focusMinutes,
        break_minutes: breakMinutes,
        timer_mode: "focus",
        time_left: focusMinutes * 60
      }
    ])
    .select()
    .single();

  if (error) {
    console.error(error);
    alert("Something went wrong creating the room ♡");
    return;
  }

  const roomUrl =
    window.location.origin +
    window.location.pathname +
    "?room=" +
    roomCode;

  prompt(
    "Your study room is ready ♡ Send this link to your friend:",
    roomUrl
  );
}
</script>

</body>
